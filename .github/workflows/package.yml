name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build redscarf.exe
        run: go build -trimpath -ldflags "-s -w" -o redscarf.exe .

      - name: Pack redscarf-windows.zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item redscarf.exe dist\redscarf.exe
          Copy-Item open-second-client.cmd dist\open-second-client.cmd
          Copy-Item config.ini.example dist\config.ini
          gh release download --repo redscarf26/arctium-wow-launcher --pattern "Arctium.WoW.Launcher.exe" --dir dist --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item -LiteralPath "dist\Arctium.WoW.Launcher.exe" -NewName "Arctium WoW Launcher.exe"
          if (Test-Path redscarf-windows.zip) { Remove-Item redscarf-windows.zip }
          Compress-Archive -Path dist\* -DestinationPath redscarf-windows.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = "latest"
          if ($env:REF_TYPE -eq "tag") { $tag = $env:REF_NAME }
          $notes = "redscarf-windows.zip contains redscarf.exe, Arctium WoW Launcher.exe, config.ini, and open-second-client.cmd. Unzip the folder, set wow_path in config.ini, then run redscarf.exe."
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag redscarf.exe redscarf-windows.zip --title $tag --notes $notes
          } else {
            gh release upload $tag redscarf.exe redscarf-windows.zip --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes $notes
          }
